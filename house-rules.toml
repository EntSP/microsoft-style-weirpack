[[rule]]
name = "Dashes"
level = "error"
message = "Remove the spaces around '%s'."
patterns = ['\s[—–]\s|\s[—–]|[—–]\s']
ignore_case = true

[[rule]]
name = "DateFormat"
level = "error"
message = "Use 'July 31, 2016' format, not '%s'."
patterns = ['\d{1,2} (?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?) \d{4}']
ignore_case = true

[[rule]]
name = "DateNumbers"
level = "error"
message = "Don't use ordinal numbers for dates."
patterns = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth', 'eleventh', 'twelfth', 'thirteenth', 'fourteenth', 'fifteenth', 'sixteenth', 'seventeenth', 'eighteenth', 'nineteenth', 'twentieth', 'twenty-first', 'twenty-second', 'twenty-third', 'twenty-fourth', 'twenty-fifth', 'twenty-sixth', 'twenty-seventh', 'twenty-eighth', 'twenty-ninth', 'thirtieth', 'thirty-first']
ignore_case = true

[[rule]]
name = "DateOrder"
level = "error"
message = "Always spell out the name of the month."
patterns = ['\b\d{1,2}/\d{1,2}/(?:\d{4}|\d{2})\b']
ignore_case = true

[[rule]]
name = "Ellipses"
level = "warning"
message = "In general, don't use an ellipsis."
patterns = ['\.\.\.']

[[rule]]
name = "ExclamationPoints"
level = "hint"
message = "Use exclamation points sparingly."
patterns = ['\w!(?:\s|$)']

[[rule]]
name = "FirstPerson"
level = "warning"
message = "Use first person (such as '%s') sparingly."
patterns = ['(?<=^|\s)I(?=[\s,])', "\\bI'd\\b", "\\bI'll\\b", "\\bI'm\\b", "\\bI've\\b", '\bme\b', '\bmy\b', '\bmine\b']
ignore_case = true

[[rule]]
name = "Foreign-BEgEGS"
level = "error"
message = "Use '%r' instead of '%s'."
patterns = ['\b(?:eg|e\.g\.)[\s,]']
ignore_case = true
becomes = "for example"

[[rule]]
name = "Foreign-BErgoS"
