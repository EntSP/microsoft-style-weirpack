# The checks from the Microsoft pack that Weir cannot express, because
# Weir requires a `becomes` and these cannot say what to write instead.
#
# Paste into your markdoc-prose.toml. `%s` is the matched text, `%r` is
# `becomes`.


[[rule]]
name = "AMPM"
level = "error"
message = "Use 'AM' or 'PM' (preceded by a space)."
patterns = ['\d{1,2}[AP]M', '\d{1,2} ?[ap]m', '\d{1,2} ?[aApP]\.[mM]\.']

[[rule]]
name = "Accessibility"
level = "hint"
message = "Don't use language (such as '%s') that defines people by their disability."
patterns = ['a victim of', 'able-bodied', 'an epileptic', 'birth defect', 'crippled', 'differently abled', 'disabled', 'dumb', 'handicapped', 'handicaps', 'healthy person', 'hearing-impaired', 'lame', 'maimed', 'mentally handicapped', 'missing a limb', 'mute', 'non-verbal', 'normal person', 'sight-impaired', 'slow learner', 'stricken with', 'suffers from', 'vision-impaired']
ignore_case = true

[[rule]]
name = "Adverbs"
level = "warning"
message = "Remove '%s' if it's not important to the meaning of the statement."
patterns = ['abnormally', 'absentmindedly', 'accidentally', 'adventurously', 'anxiously', 'arrogantly', 'awkwardly', 'bashfully', 'beautifully', 'bitterly', 'bleakly', 'blindly', 'blissfully', 'boastfully', 'boldly', 'bravely', 'briefly', 'brightly', 'briskly', 'broadly', 'busily', 'calmly', 'carefully', 'carelessly', 'cautiously', 'cheerfully', 'cleverly', 'closely', 'coaxingly', 'colorfully', 'continually', 'coolly', 'courageously', 'crossly', 'cruelly', 'curiously', 'daintily', 'dearly', 'deceivingly', 'deeply', 'defiantly', 'deliberately', 'delightfully', 'diligently', 'dimly', 'doubtfully', 'dreamily', 'easily', 'effectively', 'elegantly', 'energetically', 'enormously', 'enthusiastically', 'excitedly', 'extremely', 'fairly', 'faithfully', 'famously', 'ferociously', 'fervently', 'fiercely', 'fondly', 'foolishly', 'fortunately', 'frankly', 'frantically', 'freely', 'frenetically', 'frightfully', 'furiously', 'generally', 'generously', 'gently', 'gladly', 'gleefully', 'gracefully', 'gratefully', 'greatly', 'greedily', 'happily', 'hastily', 'healthily', 'heavily', 'helplessly', 'honestly', 'hopelessly', 'hungrily', 'innocently', 'inquisitively', 'intensely', 'intently', 'interestingly', 'inwardly', 'irritably', 'jaggedly', 'jealously', 'jovially', 'joyfully', 'joyously', 'jubilantly', 'judgmentally', 'justly', 'keenly', 'kiddingly', 'kindheartedly', 'knavishly', 'knowingly', 'knowledgeably', 'lazily', 'lightly', 'limply', 'lively', 'loftily', 'longingly', 'loosely', 'loudly', 'lovingly', 'loyally', 'madly', 'majestically', 'meaningfully', 'mechanically', 'merrily', 'miserably', 'mockingly', 'mortally', 'mysteriously', 'naturally', 'nearly', 'neatly', 'nervously', 'nicely', 'noisily', 'obediently', 'obnoxiously', 'oddly', 'offensively', 'optimistically', 'overconfidently', 'painfully', 'partially', 'patiently', 'perfectly', 'playfully', 'politely', 'poorly', 'positively', 'potentially', 'powerfully', 'promptly', 'properly', 'punctually', 'quaintly', 'queasily', 'queerly', 'questionably', 'quickly', 'quietly', 'quirkily', 'quite', 'quizzically', 'randomly', 'rapidly', 'rarely', 'readily', 'really', 'reassuringly', 'recklessly', 'regularly', 'reluctantly', 'repeatedly', 'reproachfully', 'restfully', 'righteously', 'rightfully', 'rigidly', 'roughly', 'rudely', 'safely', 'scarcely', 'scarily', 'searchingly', 'sedately', 'seemingly', 'selfishly', 'separately', 'seriously', 'shakily', 'sharply', 'sheepishly', 'shrilly', 'shyly', 'silently', 'sleepily', 'slowly', 'smoothly', 'softly', 'solemnly', 'solidly', 'speedily', 'stealthily', 'sternly', 'strictly', 'suddenly', 'supposedly', 'surprisingly', 'suspiciously', 'sweetly', 'swiftly', 'sympathetically', 'tenderly', 'tensely', 'terribly', 'thankfully', 'thoroughly', 'thoughtfully', 'tightly', 'tremendously', 'triumphantly', 'truthfully', 'ultimately', 'unabashedly', 'unaccountably', 'unbearably', 'unethically', 'unexpectedly', 'unfortunately', 'unimpressively', 'unnaturally', 'unnecessarily', 'urgently', 'usefully', 'uselessly', 'utterly', 'vacantly', 'vaguely', 'vainly', 'valiantly', 'vastly', 'verbally', 'very', 'viciously', 'victoriously', 'violently', 'vivaciously', 'voluntarily', 'warmly', 'weakly', 'wearily', 'wetly', 'wholly', 'wildly', 'willfully', 'wisely', 'woefully', 'wonderfully', 'worriedly', 'yawningly', 'yearningly', 'yieldingly', 'youthfully', 'zealously', 'zestfully', 'zestily']
ignore_case = true

[[rule]]
name = "Auto"
level = "error"
message = "In general, don't hyphenate '%s'."
patterns = ['auto-\w+']
ignore_case = true

[[rule]]
name = "Avoid"
level = "error"
message = "Don't use '%s'. See the A-Z word list for details."
patterns = ['abortion', 'and so on', 'app(?:lication)?s? (?:developer|program)', 'app(?:lication)? file', 'backbone', 'backend', 'contiguous selection', 'fubar', 'outdent(?:ing|ed|s)?']
ignore_case = true

[[rule]]
name = "BiasFree-DemilitarizedZoneD"
level = "warning"
message = "Consider '%r' instead of '%s'."
patterns = ['(?:demilitarized zone|DMZ)']
ignore_case = true
becomes = "perimeter network"

