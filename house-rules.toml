[[rule]]
name = "UIVerbs"
level = "warning"
message = "Use 'select' instead of the input-specific verb '%s'."
patterns = ['(?<!right-)(?<!double-)click(?:s|ed|ing)?(?: on)?', 'swipe(?:s|d|ing)?']
ignore_case = true

[[rule]]
name = "Units"
level = "error"
message = "Don't spell out the number in '%s'."
patterns = ['(?:centi|milli)?meters', '(?:kilo)?grams', '(?:kilo)?meters', '(?:mega)?pixels', 'cm', 'inches', 'lb', 'miles', 'pounds']
ignore_case = true

[[rule]]
name = "Uppercase"
level = "hint"
message = "Don't use all uppercase for emphasis."
patterns = ['\b[A-Z]{2,}(?: [A-Z]{2,})+\b']

[[rule]]
name = "Vocab"
level = "hint"
message = "Verify your use of '%s' with the A-Z word list."
patterns = ['above', 'accessible', 'actionable', 'against', 'alarm', 'alert', 'alias', 'allows?', 'and/or', 'as well as', 'assure', 'author', 'avg', 'beta', 'ensure', 'he', 'insure', 'sample', 'set (?:a|an|the|your)', 'she', 'specify']
