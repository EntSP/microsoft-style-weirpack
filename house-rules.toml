check|open|close|press|turn|place|pull|push|replace|select|locate|wipe|fasten|loosen|tighten|mount|insert|slide|set|put|move|raise|lower|hold|release|attach|detach|align|adjust|clean|apply|wait|start|stop|test|follow|ensure|verify|confirm|unplug|unscrew|position|rest|restart|reinstall|reconnect|reassemble|make|take|see|note|consider|use|get|keep|leave|let|allow|find|look|read|write|run|try|is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did|in|on|off|of|for|to|from|into|onto|by|as|over|under|at|via|per|through|across|around|about|within|upon|out|up|down|than|like)\b)\w+(?: (?!(?i:and|or|is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did|in|on|off|of|for|to|from|with|without|between|among|into|onto|by|as|such|over|under|at|via|per|including|through|across|around|about|within|upon|out|up|down|than|like)\b)\w+){1,3}|(?!(?i:which|who|whom|whose|that|where|when|while|because|since|although|though|if|unless|so|but|and|or|however|therefore|thus|specifically|especially|namely|then|either|neither|such|with|without|between|among|including|example|is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did)\b)\w+) (?:and |or (?!(?i:not)\b))(?:(?!(?i:and|or|is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did|in|on|off|of|for|to|from|with|without|between|among|into|onto|by|as|such|over|under|at|via|per|including|through|across|around|about|within|upon|out|up|down|than|like)\b)\w+ ){0,3}(?!(?i:and|or|is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did|in|on|off|of|for|to|from|with|without|between|among|into|onto|by|as|such|over|under|at|via|per|including|through|across|around|about|within|upon|out|up|down|than|like)\b)\w+[.?!]']

