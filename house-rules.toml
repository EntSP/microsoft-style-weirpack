level = "hint"
message = "'%s' looks like passive voice."
patterns = ['[\w]+ed', 'awoken', 'beat', 'become', 'been', 'begun', 'bent', 'beset', 'bet', 'bid', 'bidden', 'bitten', 'bled', 'blown', 'born', 'bought', 'bound', 'bred', 'broadcast', 'broken', 'brought', 'built', 'burnt', 'burst', 'cast', 'caught', 'chosen', 'clung', 'come', 'cost', 'crept', 'cut', 'dealt', 'dived', 'done', 'drawn', 'dreamt', 'driven', 'drunk', 'dug', 'eaten', 'fallen', 'fed', 'felt', 'fit', 'fled', 'flown', 'flung', 'forbidden', 'foregone', 'forgiven', 'forgotten', 'forsaken', 'fought', 'found', 'frozen', 'given', 'gone', 'gotten', 'ground', 'grown', 'heard', 'held', 'hidden', 'hit', 'hung', 'hurt', 'kept', 'knelt', 'knit', 'known', 'laid', 'lain', 'leapt', 'learnt', 'led', 'left', 'lent', 'let', 'lighted', 'lost', 'made', 'meant', 'met', 'misspelt', 'mistaken', 'mown', 'overcome', 'overdone', 'overtaken', 'overthrown', 'paid', 'pled', 'proven', 'put', 'quit', 'read', 'rid', 'ridden', 'risen', 'run', 'rung', 'said', 'sat', 'sawn', 'seen', 'sent', 'set', 'sewn', 'shaken', 'shaven', 'shed', 'shod', 'shone', 'shorn', 'shot', 'shown', 'shrunk', 'shut', 'slain', 'slept', 'slid', 'slit', 'slung', 'smitten', 'sold', 'sought', 'sown', 'sped', 'spent', 'spilt', 'spit', 'split', 'spoken', 'spread', 'sprung', 'spun', 'stolen', 'stood', 'stridden', 'striven', 'struck', 'strung', 'stuck', 'stung', 'stunk', 'sung', 'sunk', 'swept', 'swollen', 'sworn', 'swum', 'swung', 'taken', 'taught', 'thought', 'thrived', 'thrown', 'thrust', 'told', 'torn', 'trodden', 'understood', 'upheld', 'upset', 'wed', 'wept', 'withheld', 'withstood', 'woken', 'won', 'worn', 'wound', 'woven', 'written', 'wrung']
ignore_case = true

[[rule]]
name = "Percentages"
level = "error"
message = "Use a numeral plus the units."
patterns = ['\b[a-zA-z]+\spercent\b']

[[rule]]
name = "QuestionMarks"
level = "hint"
message = "Use questions sparingly."
patterns = ['\w\?(?:\s|$)']

[[rule]]
name = "Quotes"
level = "error"
message = "Punctuation should be inside the quotes."
patterns = ['["“][^"”“]+["”][.,]']

[[rule]]
name = "RangeTime"
level = "error"
message = "Use 'to' instead of a dash in '%s'."
patterns = ['\b(?:AM|PM)\s?[-–]\s?.+(?:AM|PM)\b']

[[rule]]
name = "Semicolon"
level = "hint"
message = "Try to simplify this sentence."
patterns = [';']

[[rule]]
name = "Spacing"
level = "error"
message = "'%s' should have one space."
patterns = ['[a-z][.?!] {2,}[A-Z]', '\b[a-z]\w*\.[A-Z]', '\w[?!][A-Z]']

[[rule]]
name = "Suspended"
level = "warning"
message = "Don't use '%s' unless space is limited."
patterns = ['\w+- and \w+-']
ignore_case = true

[[rule]]
name = "Terms-1200Midnight"
level = "warning"
message = "Prefer '%r' over '%s'."
patterns = ['12:00 midnight']
