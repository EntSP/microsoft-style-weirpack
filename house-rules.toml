[[rule]]
name = "GeneralURL"
level = "warning"
message = "For a general audience, use 'address' rather than 'URL'."
patterns = ['URL']

[[rule]]
name = "HeadingAcronyms"
level = "warning"
message = "Avoid using acronyms in a title or heading."
patterns = ['[A-Z]{2,4}']

[[rule]]
name = "HeadingColons"
level = "error"
message = "Capitalize '%s'."
patterns = [':\s[a-z]']

[[rule]]
name = "HeadingPunctuation"
level = "warning"
message = "Don't use end punctuation in headings."
patterns = ['[a-z][.?!]$']

[[rule]]
name = "Hyphens"
level = "warning"
message = "'%s' doesn't need a hyphen."
patterns = ['\b[^\s-]+ly-\w+\b']

[[rule]]
name = "Militaristic-CyberKillChain"
level = "hint"
message = "Consider '%r' instead of '%s'."
patterns = ['(?:cyber ?)?kill chain']
ignore_case = true
becomes = "cyberattack chain"

[[rule]]
name = "Negative"
level = "error"
message = "Form a negative number with an en dash, not a hyphen."
patterns = ['(?<=\s)-\d+(?:\.\d+)?\b']

[[rule]]
name = "Ordinal"
level = "error"
message = "Don't add -ly to an ordinal number."
patterns = ['firstly', 'secondly', 'thirdly']
ignore_case = true

